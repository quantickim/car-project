name: Pages 배포

# 엔카는 GitHub Actions(해외 IP) 요청을 차단하므로 데이터 수집은 국내 PC에서
# `npm run publish:data` 로 하고, 여기서는 커밋된 data/ 로 빌드·배포만 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 수집된 엔카 데이터 포함
        run: |
          mkdir -p public/data
          cp data/listings.json data/history.json public/data/

      - name: 빌드
        run: npm run build
        env:
          VITE_STATIC_DATA: 'true'
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
